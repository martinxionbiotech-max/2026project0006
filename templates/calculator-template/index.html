<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator Template</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Calculator Template</h1>
    <p class="hero-description">Reusable template matching the Dating Reality Calculator style.</p>
  </header>

  <main class="grid">
    <section class="panel">
      <h2>Inputs</h2>
      <label>Country
        <select id="country"></select>
      </label>
      <label>Input A <input id="inputA" type="number" value="10" /></label>
      <label>Input B <input id="inputB" type="number" value="5" /></label>
      <button id="calculateBtn">Calculate</button>
    </section>
    <section class="panel">
      <h2>Result Panel</h2>
      <div id="result"></div>
    </section>
  </main>

  <script type="module" src="./script.js"></script>
</body>
</html>
